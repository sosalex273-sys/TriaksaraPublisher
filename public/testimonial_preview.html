<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Testimonial Image Verification</title>
  <style>
    body {font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px;}
    .grid {display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:20px;}
    .item {text-align:center;}
    img {border-radius:8px; width:150px; height:150px; object-fit:cover; border:2px solid #555;}
    h2 {color:#0ff;}
  </style>
</head>
<body>
  <h2>Reference: Hero Image (Indonesian example)</h2>
  <div class="grid">
    <div class="item"><img src="/images/hero.png" alt="Hero" /></div>
  </div>
  <h2>Testimonial Images (Unsplash queries)</h2>
  <div class="grid">
    <div class="item"><img src="https://source.unsplash.com/featured/150x150?indonesian-man" alt="Man" /></div>
    <div class="item"><img src="https://source.unsplash.com/featured/150x150?indonesian-woman" alt="Woman" /></div>
    <div class="item"><img src="https://source.unsplash.com/featured/150x150?indonesian-man" alt="Man" /></div>
    <div class="item"><img src="https://source.unsplash.com/featured/150x150?indonesian-woman" alt="Woman" /></div>
  </div>
</body>
</html>
